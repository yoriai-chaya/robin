[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.134.0",
    "loguru>=0.7.3",
    "openai-agents>=0.10.2",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.4",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
unfixable = ["F401", "F841"]

